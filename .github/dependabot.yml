version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/stack"
      - "/stack/**/*"
    schedule:
      interval: "cron"
      cronjob: "15 */4 * * *" # every 4 hours at quarter past the hour
      timezone: "America/New_York"
    target-branch: "main"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
