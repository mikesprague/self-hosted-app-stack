version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/stack"
      - "/stack/**/*"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 1
    target-branch: "main"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
