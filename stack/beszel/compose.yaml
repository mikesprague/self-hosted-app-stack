services:
  beszel:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    environment:
      APP_URL: "http://localhost:${BESZEL_PORT:-8090}"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    volumes:
      - ../../local-volumes/beszel/data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../local-volumes/beszel/agent:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: "${BESZEL_SSH_KEY}"
      TOKEN: "${BESZEL_TOKEN}"
      HUB_URL: "http://localhost:${BESZEL_PORT:-8090}"
