services:
  beszel:
    image: henrygd/beszel
    container_name: beszel
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    environment:
      APP_URL: "http://localhost:${BESZEL_PORT:-8090}"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    volumes:
      - ../../local-volumes/beszel/data:/beszel_data
