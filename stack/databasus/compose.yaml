services:
  databasus:
    image: databasus/databasus:v3.55.1
    container_name: databasus
    ports:
      - "${DATABASUS_PORT:-4005}:4005"
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      postgres-shared:
        condition: service_healthy
    environment:
      SMTP_HOST: "${MAILDEV_SMTP_HOST}"
      SMTP_PORT: "${MAILDEV_SMTP_PORT}"
      SMTP_USER: "${MAILDEV_SMTP_USER}"
      SMTP_PASSWORD: "${MAILDEV_SMTP_PASSWORD}"
      SMTP_FROM: "${DATABASUS_MAIL_FROM:-}"
      DATABASUS_URL: "http://${TAILNET_IP_ADDRESS:-localhost}:${DATABASUS_PORT:-4005}"
    volumes:
      - ../../local-volumes/databasus/data:/databasus-data
    restart: unless-stopped
