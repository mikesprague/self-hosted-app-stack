services:
  trilium:
    image: triliumnext/trilium:v0.105.0
    container_name: trilium
    ports:
      - "${TRILIUM_PORT:-8351}:8080"
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      TZ: ${TZ}
    restart: unless-stopped
    volumes:
      - ../../local-volumes/trilium-notes/data:/home/node/trilium-data
      - /etc/localtime:/etc/localtime:ro
