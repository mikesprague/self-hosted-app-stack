services:
  phoenix:
    image: arizephoenix/phoenix:20.6.0
    container_name: phoenix
    restart: unless-stopped
    depends_on:
      postgres-shared:
        condition: service_healthy
      postgres-shared-provision:
        condition: service_completed_successfully
    ports:
      - "${PHOENIX_UI_PORT:-6006}:6006" # UI/HTTP
      - "${PHOENIX_OTLP_PORT:-4317}:4317" # OTLP/gRPC
    deploy:
      resources:
        limits:
          memory: 4096M
    environment:
      PHOENIX_POSTGRES_HOST: "postgres-shared"
      PHOENIX_POSTGRES_PORT: "5432"
      PHOENIX_POSTGRES_USER: "phoenix"
      PHOENIX_POSTGRES_PASSWORD: "${POSTGRES_SHARED_APP_PASSWORD}"
      PHOENIX_POSTGRES_DB: "phoenix"
      PHOENIX_WORKING_DIR: "/app/data"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-14}"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ENABLE_MCP_SERVER: "true"
      PHOENIX_ENABLE_MCP_CODE_MODE: "true"
      OLLAMA_BASE_URL: "${OMLX_BASE_URL}/v1"
      OLLAMA_API_KEY: "${OMLX_API_KEY}"
      PHOENIX_ENABLE_OAUTH2_AUTHORIZATION_SERVER: "false"
    volumes:
      - ../../local-volumes/phoenix/data:/app/data
