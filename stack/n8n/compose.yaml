services:
  n8n-qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: n8n-qdrant
    restart: unless-stopped
    ports:
      - 6333:6333
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      QDRANT__LOG_LEVEL: "${N8N_QDRANT_LOG_LEVEL:-info}"
      QDRANT__STORAGE__PATH: "/qdrant/storage"
      QDRANT__STORAGE__USE_S3: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - ../../local-volumes/n8n/qdrant/storage:/qdrant/storage

  n8n:
    image: n8nio/n8n:2.35.2
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    deploy:
      resources:
        limits:
          memory: 4096M
    environment:
      N8N_HOST: "${TAILNET_DOMAIN}" # Set to your domain
      N8N_PORT: "${N8N_PORT:-5678}"
      N8N_PROTOCOL: "http" # Use "http" for local access
      N8N_WEBHOOK_URL: "http://${TAILNET_DOMAIN}:${N8N_PORT:-5678}/" # Your public URL for webhooks
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "1073741824" # 1024 MB
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      NODES_EXCLUDE: "[]"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_OTEL_ENABLED: "true"
      N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: "http://phoenix:6006"
      N8N_OTEL_EXPORTER_OTLP_HEADERS: "x-project-name=n8n"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres-shared"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${N8N_POSTGRES_DB}"
      DB_POSTGRESDB_USER: "${N8N_POSTGRES_USER}"
      DB_POSTGRESDB_PASSWORD: "${N8N_POSTGRES_PASSWORD}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE}"
      GENERIC_TIMEZONE: "${TZ}"
    volumes:
      - ../../local-volumes/n8n/data:/home/node/.n8n
      - /Volumes/Seagate/n8n:/data/external:rw
    depends_on:
      n8n-qdrant:
        condition: service_healthy
      postgres-shared:
        condition: service_healthy
      postgres-shared-provision:
        condition: service_completed_successfully
      bifrost:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
