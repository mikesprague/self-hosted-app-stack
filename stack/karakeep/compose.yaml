services:
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    deploy:
      resources:
        limits:
          memory: 5120M

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: karakeep-meilisearch
    restart: unless-stopped
    ports:
      - 7700:7700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - ../../local-volumes/karakeep/meilisearch:/meili_data

  karakeep-web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    container_name: karakeep-web
    deploy:
      resources:
        limits:
          memory: 4096M
    restart: unless-stopped
    depends_on:
      karakeep-chrome:
        condition: service_started
      karakeep-meilisearch:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${KARAKEEP_PORT:-7788}:3000"
    environment:
      MEILI_ADDR: "http://karakeep-meilisearch:7700"
      MEILI_MASTER_KEY: "${KARAKEEP_MEILI_MASTER_KEY}"
      BROWSER_WEB_URL: "http://karakeep-chrome:9222"
      DATA_DIR: "/data" # DON'T CHANGE THIS
      NEXTAUTH_URL: "http://localhost:7788"
      NEXTAUTH_SECRET: "${KARAKEEP_NEXTAUTH_SECRET}"
      DISABLE_SIGNUPS: "${KARAKEEP_DISABLE_SIGNUPS:-false}"
      SMTP_HOST: "${KARAKEEP_SMTP_HOST:-}"
      SMTP_PORT: "${KARAKEEP_SMTP_PORT:-}"
      SMTP_SECURE: "${KARAKEEP_SMTP_SECURE:-false}"
      SMTP_USER: "${KARAKEEP_SMTP_USER:-}"
      SMTP_PASSWORD: "${KARAKEEP_SMTP_PASSWORD:-}"
      SMTP_FROM: "${KARAKEEP_SMTP_FROM:-}"
      # OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      # OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      # OLLAMA_KEEP_ALIVE: "${KARAKEEP_OLLAMA_KEEP_ALIVE:-5m}"
      OPENAI_API_KEY: "${BIFROST_API_KEY}"
      OPENAI_BASE_URL: "${BIFROST_OPENAI_API_URL}"
      OPENAI_REASONING_EFFORT: "none"
      INFERENCE_REASONING_EFFORT: "none"
      SEMANTIC_SEARCH_ENABLED: true
      INFERENCE_TEXT_MODEL: "${KARAKEEP_INFERENCE_TEXT_MODEL:-azure/azure-5.6-luna}"
      INFERENCE_IMAGE_MODEL: "${KARAKEEP_INFERENCE_IMAGE_MODEL:-azure/azure-5.6-luna}"
      EMBEDDING_TEXT_MODEL: "${KARAKEEP_EMBEDDING_TEXT_MODEL:-azure/azure-text-embedding-3-small}"
      EMBEDDING_ENABLE_AUTO_INDEXING: true
      EMBEDDING_CONTEXT_LENGTH: 128000
      INFERENCE_CONTEXT_LENGTH: 32768
      INFERENCE_MAX_OUTPUT_TOKENS: 16384
      INFERENCE_LANG: "english"
      # INFERENCE_USE_MAX_COMPLETION_TOKENS: "${KARAKEEP_INFERENCE_USE_MAX_COMPLETION_TOKENS:-true}"
      INFERENCE_USE_MAX_COMPLETION_TOKENS: true
      INFERENCE_NUM_WORKERS: "${KARAKEEP_INFERENCE_NUM_WORKERS:-1}"
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: "${KARAKEEP_INFERENCE_ENABLE_AUTO_SUMMARIZATION:-true}"
      INFERENCE_JOB_TIMEOUT_SEC: "${KARAKEEP_INFERENCE_JOB_TIMEOUT_SEC:-90}"
    volumes:
      - ../../local-volumes/karakeep/data:/data
