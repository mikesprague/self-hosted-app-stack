services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.37.0
    container_name: headroom
    restart: unless-stopped
    ports:
      - "${HEADROOM_PORT:-8787}:8787"
    deploy:
      resources:
        limits:
          memory: 8192M
    environment:
      HEADROOM_WORKSPACE_DIR: /home/nonroot/.headroom
      HEADROOM_PORT: "${HEADROOM_PORT:-8787}"
      HEADROOM_HOST: "${HEADROOM_HOST:-0.0.0.0}"
      HEADROOM_MODE: "${HEADROOM_MODE:-token}" # token or cache
      HEADROOM_LOG_LEVEL: "${HEADROOM_LOG_LEVEL:-INFO}"
      HEADROOM_BASE_URL: "${HEADROOM_BASE_URL:-http://localhost:${HEADROOM_PORT:-8787}}"
      HEADROOM_API_KEY: "${HEADROOM_API_KEY:-}" # none, or set to your API key for authentication
      HEADROOM_CODE_AWARE_ENABLED: "1"
      HEADROOM_TELEMETRY: "0"
      HEADROOM_OUTPUT_SHAPER: "1"
      HEADROOM_TOOL_SEARCH: "0"
      HEADROOM_OPENAI_TOOL_SEARCH: "0"
      ENABLE_TOOL_SEARCH: "0"
      HEADROOM_TEXT_CRUSHER: "1"
      HEADROOM_KOMPRESS_MAX_TOKENS: "4096"
      OPENAI_TARGET_API_URL: "${BIFROST_OPENAI_API_URL}"
      OPENAI_API_KEY: "${BIFROST_API_KEY}"
      ANTHROPIC_API_KEY: "${BIFROST_API_KEY}"
      ANTHROPIC_TARGET_API_URL: "${BIFROST_ANTHROPIC_API_URL}"
      PATH: /home/nonroot/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    entrypoint:
      - /bin/sh
      - -c
      - |
        python -m pip install "headroom-ai[code]" --root-user-action=ignore
        exec headroom proxy --host 0.0.0.0 --port 8787
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      bifrost:
        condition: service_healthy
    volumes:
      - ../../local-volumes/headroom/data:/home/nonroot/.headroom
      - ../../local-volumes/headroom/local:/home/nonroot/.local
