services:
  bifrost-qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: bifrost-qdrant
    restart: unless-stopped
    ports:
      - "${BIFROST_QDRANT_REST_PORT:-6333}:6333" # REST API
      - "${BIFROST_QDRANT_GRPC_PORT:-6334}:6334" # gRPC API (optional)
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      QDRANT__LOG_LEVEL: "${BIFROST_QDRANT_LOG_LEVEL:-info}"
      QDRANT__STORAGE__PATH: "/qdrant/storage"
      QDRANT__STORAGE__USE_S3: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - ../../local-volumes/bifrost/cache/qdrant:/qdrant/storage
      # - ../../local-volumes/bifrost/qdrant/config.yaml:/qdrant/config.yaml

  bifrost:
    image: maximhq/bifrost:2.1.29
    container_name: bifrost
    ports:
      - "${BIFROST_APP_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      bifrost-qdrant:
        condition: service_healthy
      postgres-shared:
        condition: service_healthy
      postgres-shared-provision:
        condition: service_completed_successfully
    environment:
      APP_HOST: "${BIFROST_APP_HOST:-0.0.0.0}"
      BIFROST_POSTGRES_HOST: "postgres-shared"
      BIFROST_POSTGRES_PORT: "5432"
      BIFROST_POSTGRES_USER: "${BIFROST_POSTGRES_USER}"
      BIFROST_POSTGRES_PASSWORD: "${BIFROST_POSTGRES_PASSWORD}"
      BIFROST_POSTGRES_DB: "${BIFROST_POSTGRES_DB}"
      BIFROST_API_KEY: "${BIFROST_API_KEY}"
      LOG_LEVEL: "${BIFROST_LOG_LEVEL:-debug}"
      LOG_STYLE: "${BIFROST_LOG_STYLE:-json}"
      AZURE_ENDPOINT: "${AZURE_FOUNDRY_BASE_URL}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY}"
      OLLAMA_URL: "${OLLAMA_BASE_URL}"
      OLLAMA_ENDPOINT: "${OLLAMA_BASE_URL}"
      LLAMA_SERVER_URL: "${LLAMA_SERVER_OPENAI_API_URL}"
      ATLASSIAN_MCP_SERVER_URL: "http://atlassian-mcp:9000/mcp"
      TDX_MCP_SERVER_URL: "${TDX_MCP_SERVER_URL}"
      CONTEXT7_MCP_SERVER_URL: "https://mcp.context7.com/mcp"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
      MERMAID_MCP_SERVER_URL: "https://mcp.mermaid.ai/mcp"
      CRAWL4AI_MCP_SERVER_URL: "http://crawl4ai:11235/mcp/sse"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN}"
      CRAWL4AI_AUTH_HEADER: "Bearer ${CRAWL4AI_API_TOKEN}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY}"
      OTEL_RESOURCE_ATTRIBUTES: "openinference.project.name=bifrost"
    volumes:
      - ../../local-volumes/bifrost/data:/app/data
    restart: unless-stopped
