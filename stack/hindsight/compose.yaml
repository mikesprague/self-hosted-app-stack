services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:1.2.0
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "${HINDSIGHT_API_PORT:-8888}:8888"
      - "${HINDSIGHT_UI_PORT:-9999}:9999"
    deploy:
      resources:
        limits:
          memory: 8192M
    shm_size: 1G
    environment:
      HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
      # HINDSIGHT_API_LLM_PROVIDER: "openai"
      # HINDSIGHT_API_RETAIN_LLM_PROVIDER: "openai"
      # HINDSIGHT_API_REFLECT_LLM_PROVIDER: "openai"
      # HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER: "openai"
      # HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_PROVIDER: "openai"
      # HINDSIGHT_API_LLM_MODEL: "fireworks/glm-5.3-flash"
      # HINDSIGHT_API_RETAIN_LLM_MODEL: "fireworks/glm-5.3-flash"
      # HINDSIGHT_API_REFLECT_LLM_MODEL: "fireworks/glm-5.3-flash"
      # HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: "fireworks/glm-5.3-flash"
      # HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MODEL: "fireworks/glm-5.3-flash"
      # HINDSIGHT_API_LLM_EXTRA_BODY: '{"service_tier":"priority"}'
      # HINDSIGHT_API_RETAIN_LLM_EXTRA_BODY: '{"service_tier":"priority"}'
      # HINDSIGHT_API_REFLECT_LLM_EXTRA_BODY: '{"service_tier":"priority"}'
      # HINDSIGHT_API_CONSOLIDATION_LLM_EXTRA_BODY: '{"service_tier":"priority"}'
      # HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_EXTRA_BODY: '{"service_tier":"priority"}'
      HINDSIGHT_API_LLM_PROVIDER: "openai-responses"
      HINDSIGHT_API_LLM_BASE_URL: "${BIFROST_OPENAI_API_URL}"
      HINDSIGHT_API_LLM_API_KEY: "${BIFROST_API_KEY}"
      HINDSIGHT_API_LLM_MODEL: "azure/hindsight-6-luna"
      HINDSIGHT_API_LLM_TIMEOUT: "180"
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "600"
      HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_TIMEOUT: "600"
      # HINDSIGHT_API_LLM_REASONING_EFFORT: "none"
      HINDSIGHT_API_DATABASE_SCHEMA: "${HINDSIGHT_API_DATABASE_SCHEMA:-public}"
      HINDSIGHT_API_DATABASE_URL: "${HINDSIGHT_API_DATABASE_URL:-pg0}"
      HINDSIGHT_API_DATABASE_BACKEND: "${HINDSIGHT_API_DATABASE_BACKEND:-postgresql}"
      HINDSIGHT_API_MENTAL_MODELS_CRON: "0 */6 * * *" # every 6 hours
      # HINDSIGHT_API_DISABLE_DB_MAINTENANCE_DISCOVERY: "1"
      HINDSIGHT_API_WORKER_ID: "hindsight-worker-1"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: "local"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: "BAAI/bge-small-en-v1.5"
      # HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: "hindsight-ai/hs-embed-1" # same dimensions/drop-in replaccement for above - requires re-embedding all banks
      HINDSIGHT_API_DECISION_MODEL_PROVIDER: "typesafe"
      HINDSIGHT_API_DECISION_MODEL_API_KEY: "${TYPESAFE_API_KEY}"
      HINDSIGHT_API_DECISION_MODEL_MODEL: "jev-preview"
      HINDSIGHT_API_RERANKER_PROVIDER: "local"
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: "hindsight-ai/hs-rerank-1"
      HINDSIGHT_API_RECALL_DECISION_MODEL_PRUNE: "true"
      HINDSIGHT_API_RECALL_DECISION_MODEL_DEDUP: "true"
      HINDSIGHT_API_LLM_TRACE_DELETE_WITH_DOCUMENT: "true"
      HINDSIGHT_API_DEFAULT_TIMEZONE: "${TZ:-America/New_York}"
    depends_on:
      bifrost:
        condition: service_healthy
      headroom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health/live').close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      - ../../local-volumes/hindsight/data/.pg0:/home/hindsight/.pg0
      - ../../local-volumes/hindsight/data:/home/hindsight
