services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.18.0
    container_name: convertx
    restart: unless-stopped
    ports:
      - "${CONVERTX_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 4096M
    environment:
      JWT_SECRET: "${CONVERTX_JWT_SECRET}"
      HTTP_ALLOWED: "true"
    volumes:
      - ../../local-volumes/convertx/data:/app/data
