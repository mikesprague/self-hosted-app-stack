services:
  open-design:
    image: ghcr.io/nexu-io/od:0.21.1
    container_name: open-design
    environment:
      NODE_ENV: "production"
      NODE_OPTIONS: "${OPEN_DESIGN_NODE_OPTIONS:---max-old-space-size=192}"
      OD_BIND_HOST: "0.0.0.0"
      OD_ALLOWED_ORIGINS: "${OPEN_DESIGN_ALLOWED_ORIGINS:-}"
      OD_PORT: "7456"
      OD_WEB_PORT: ${OPEN_DESIGN_PORT:-7456}
      OD_API_TOKEN: ${OPEN_DESIGN_API_TOKEN}
      OD_DISABLE_API_AUTH: ${OPEN_DESIGN_DISABLE_API_AUTH:-}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
    network_mode: host
    ports: []
    # ports:
    #   - "${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - ../../local-volumes/open-design/data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-2048m}
    deploy:
      resources:
        limits:
          memory: ${OPEN_DESIGN_MEM_LIMIT:-2048M}
          pids: 256
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
